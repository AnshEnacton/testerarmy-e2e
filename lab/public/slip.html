<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visit slip</title>
    <style>
      body {
        margin: 16px;
        color: #1e2430;
        background: #fffaf2;
        font: 16px/1.45 Georgia, "Palatino Linotype", serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <h1>Visit slip</h1>
    <p id="who"></p>
    <p>Bring this slip to the front desk.</p>
    <script>
      const name = new URLSearchParams(location.search).get('name') || 'Unknown';
      document.getElementById('who').textContent = name;
    </script>
  </body>
</html>
